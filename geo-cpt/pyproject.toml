[project]
name = "geo-cpt"
version = "0.1.0"
description = "Continued pre-training (DAPT/TAPT) lab for geoscience on Apple Silicon"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Bongiorno" }]
dependencies = [
    "mlx>=0.29",
    "mlx-lm>=0.28",
    "transformers>=4.55",
    "tokenizers>=0.21",
    "httpx>=0.27",
    "tenacity>=9.0",
    "selectolax>=0.3.21",
    "datasketch>=1.6",        # MinHash/LSH near-duplicate detection
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "matplotlib>=3.9",
    "numpy>=1.26",
    # the SFT project next door: its corpus, schema and scorer are reused for
    # the downstream-transfer experiment (does CPT then SFT beat SFT alone?)
    "geo-sft",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv.sources]
geo-sft = { path = "../geo-sft", editable = true }

[project.scripts]
geocpt = "geocpt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geocpt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads a model; run before any long training run"]
