# Tiny end-to-end run to prove the wiring before committing hours.
name: geo-cpt-smoke

corpus:
  stage: tapt
  quality_filter: false
  replay_fraction: 0.15
  val_docs: 60
  seed: 17

pack:
  block_size: 512
  add_eos_between_docs: true
  no_cross_document: false

train:
  base_model: Qwen/Qwen3-0.6B
  fine_tune_type: full
  learning_rate: 0.00001
  warmup_iters: 8
  batch_size: 1
  grad_accumulation_steps: 4
  iters: 40
  steps_per_report: 5
  steps_per_eval: 20
  save_every: 40
  keep_last_n: 1
  grad_checkpoint: true
  seed: 17

eval:
  max_blocks: 20
  probe_n: 40
