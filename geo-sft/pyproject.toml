[project]
name = "geo-sft"
version = "0.1.0"
description = "End-to-end supervised fine-tuning lab for geoscience structured extraction on Apple Silicon"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Bongiorno" }]
dependencies = [
    # --- Apple-native training (primary path) ---
    "mlx>=0.29",
    "mlx-lm>=0.28",
    # --- HuggingFace parallel path ---
    "torch>=2.5",
    "transformers>=4.55",
    "peft>=0.17",
    "trl>=0.21",
    "accelerate>=1.0",
    "datasets>=3.0",
    # --- tokenisation ---
    "tokenizers>=0.21",
    "sentencepiece>=0.2",
    # --- corpus acquisition & parsing ---
    "httpx>=0.27",
    "tenacity>=9.0",
    "pymupdf>=1.24",
    "selectolax>=0.3.21",
    # --- plumbing ---
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "matplotlib>=3.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
geosft = "geosft.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geosft"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
