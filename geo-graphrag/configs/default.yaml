# One config drives ingest, the three retrievers, the benchmark and the MCP
# server. Every retriever shares the SAME answer model and prompt, so the only
# thing that varies between them is the context they retrieve.

llm:
  base_url: http://localhost:1234/v1     # LM Studio's OpenAI-compatible server
  chat_model: google/gemma-4-12b         # answers, text-to-Cypher, question generation
  judge_model: google/gemma-4-12b        # benchmark grader (see docs/LEARNING.md §9)
  embed_model: text-embedding-nomic-embed-text-v1.5
  embed_dim: 768
  temperature: 0.0
  max_tokens: 1024
  # Gemma 4 thinks before it answers. "none" is ~8x faster; turning it on is
  # experiment #3 (does thinking help text-to-Cypher?).
  reasoning_effort: none

neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  password: geograph-lab             # matches docker-compose.yml
  database: neo4j

ingest:
  limit_units: null        # null = all 3,302 Geolex units; set small for a smoke run
  embed_batch: 64

retrieval:
  rag_k: 8                 # passages for vector RAG
  graphrag_k: 5            # entry passages for GraphRAG (graph facts fill the rest)
  graphrag_max_units: 4    # how many units to expand around
  kg_max_rows: 60          # rows of a Cypher result shown to the answer model
  kg_retries: 1            # re-ask the model with the Neo4j error on a bad query

bench:
  seed: 13
  per_category: 8          # questions per category; 8 categories
  name: bench-v1
