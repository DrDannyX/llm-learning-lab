# Neo4j 5 community: property graph + native vector index in one store, so
# RAG, KG and GraphRAG all read from the same database.
services:
  neo4j:
    image: neo4j:5-community
    container_name: georag-neo4j
    ports:
      - "7474:7474"   # browser: http://localhost:7474
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/geograph-lab
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - ./data/neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      retries: 30
